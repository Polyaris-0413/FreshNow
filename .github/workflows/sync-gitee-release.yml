name: 同步发行版到 Gitee

# Gitee 的仓库镜像（仓库设置 → 仓库镜像管理）只同步分支、标签与提交记录，不同步发行版与附件，
# 所以镜像过来的仓库里 releases 为空，大陆用户既查不到新版本也下不到 apk。
# 出处：https://help.gitee.com/repository/settings/sync-between-gitee-github
#
# 这里补的正是镜像缺的那一段：GitHub 发布发行版后，用 Gitee OpenAPI 建一份同样的发行版并上传 apk。
# 接口清单见 https://gitee.com/api/v5/swagger_doc（POST /repos/{owner}/{repo}/releases 与 .../attach_files）。
on:
  release:
    types: [published]
  # 手动补跑：镜像开通前发布的版本，以及同步失败后重试
  workflow_dispatch:
    inputs:
      tag:
        description: 要补同步到 Gitee 的 tag（如 v1.8.1）
        required: true

permissions:
  contents: write

concurrency:
  group: gitee-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  # Gitee 用户名与 GitHub 用户名不同，无法从 github.repository 推导，改仓库只改这一处
  GITEE_REPO: Polyaris/FreshNow
  # 镜像触发的最短间隔是 5 分钟，tag 到达 Gitee 会晚于启动本任务，故先等 tag 落地再建发行版
  TAG_WAIT_ATTEMPTS: 20
  TAG_WAIT_SECONDS: 30

jobs:
  sync:
    # 预览版本不对外分发，不同步到 Gitee
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      # 提交 version.json 需要工作区；release 事件默认检出 tag，这里明确要 main
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 取出版本号与发行说明
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::既没有 release 事件里的 tag，也没有手动输入的 tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$EVENT_TAG" ]; then
            jq -r '.release.name // .release.tag_name' "$GITHUB_EVENT_PATH" > title.txt
            jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" > body.md
          else
            # 手动补跑没有事件载荷，发行说明得回查到 GitHub 上的那一版
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
            jq -r '.name // .tag_name' release.json > title.txt
            jq -r '.body // ""' release.json > body.md
          fi

          # Gitee 建发行版时 name 与 body 都是必填，空值会被接口拒绝
          [ -s title.txt ] || printf '%s' "$TAG" > title.txt
          [ -s body.md ] || printf 'Release %s' "$TAG" > body.md

      - name: 等待 tag 同步并创建 Gitee 发行版
        id: create
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          IFS='/' read -r OWNER REPO <<< "$GITEE_REPO"
          api="https://gitee.com/api/v5/repos/$OWNER/$REPO"

          # 逐页找 tag：仓库 tag 数量会一直增长，只查第一页迟早漏掉旧版本的回填
          tag_exists() {
            local page=1 body count
            while :; do
              # 接口出错时会返回对象而不是数组，这里按「本页没有 tag」处理，由外层重试兜住
              body=$(curl -sS -m 30 "$api/tags?per_page=100&page=$page") || return 2
              count=$(printf '%s' "$body" | jq 'if type == "array" then length else 0 end' 2>/dev/null) || count=0
              [ "$count" -eq 0 ] && return 1
              if printf '%s' "$body" | jq -e --arg t "$TAG" 'any(.[]; .name == $t)' >/dev/null; then
                return 0
              fi
              [ "$count" -lt 100 ] && return 1
              page=$((page + 1))
              [ "$page" -gt 50 ] && return 2
            done
          }

          ready=false
          for _ in $(seq 1 "$TAG_WAIT_ATTEMPTS"); do
            if tag_exists; then ready=true; break; fi
            sleep "$TAG_WAIT_SECONDS"
          done
          if [ "$ready" != true ]; then
            echo "::error::Gitee 仓库 $GITEE_REPO 上找不到 tag $TAG（已等待 $((TAG_WAIT_ATTEMPTS * TAG_WAIT_SECONDS)) 秒）。镜像未开启或同步失败时会出现这种情况。"
            exit 1
          fi

          # 幂等：这个 tag 已经有发行版就不再建，重跑不会产生重复发行版
          code=$(curl -sS -m 30 -o existing.json -w '%{http_code}' "$api/releases/tags/$TAG")
          # 200 但内容不是发行版对象时不能当成命中，否则会拿空 id 去上传
          if [ "$code" = "200" ] && jq -e '.id | numbers' existing.json >/dev/null 2>&1; then
            echo "release_id=$(jq -r '.id' existing.json)" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "### Gitee 已存在 $TAG 的发行版，跳过创建" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          payload=$(jq -n \
            --arg token "$GITEE_TOKEN" \
            --arg tag "$TAG" \
            --arg name "$(cat title.txt)" \
            --arg body "$(cat body.md)" \
            --arg target "$TAG" \
            '{access_token: $token, tag_name: $tag, name: $name, body: $body, target_commitish: $target, prerelease: false}')
          code=$(curl -sS -m 60 -o created.json -w '%{http_code}' \
            -X POST "$api/releases" \
            -H "Content-Type: application/json" \
            -d "$payload")
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "::error::创建 Gitee 发行版失败（HTTP $code）：$(head -c 800 created.json)"
            exit 1
          fi
          echo "release_id=$(jq -r '.id' created.json)" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: 上传 apk 到 Gitee 发行版
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        run: |
          set -euo pipefail
          IFS='/' read -r OWNER REPO <<< "$GITEE_REPO"
          api="https://gitee.com/api/v5/repos/$OWNER/$REPO"

          # 附件直接取 GitHub 上已发布的产物，不重新构建：两边必须是同一个二进制
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir dist
          shopt -s nullglob
          apks=(dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::GitHub 上的 $TAG 没有 apk 附件"
            exit 1
          fi

          # 建发行版与传附件分在两个 step，中间这一版可能被删掉（例如发布者手动删除），
          # 此时接口回的是 HTML 错误页而不是 JSON，直接喂给 jq 只会得到看不出原因的解析错误
          code=$(curl -sS -m 30 -o attached.json -w '%{http_code}' \
            "$api/releases/$RELEASE_ID/attach_files?per_page=100")
          if [ "$code" != "200" ] || ! jq -e 'type == "array"' attached.json >/dev/null 2>&1; then
            echo "::error::读取 Gitee 发行版 $RELEASE_ID 的附件列表失败（HTTP $code），该发行版可能已被删除；重新运行本任务即可重建：$(head -c 500 attached.json)"
            exit 1
          fi

          # 同名附件要先比大小：Gitee 上的同名文件可能是发布者手工传错的包（实测碰到过一个标 v1.9.0
          # 但 versionName 是 1.8.1 的），一律跳过的话客户端会一直下到旧包、装完又提示有新版
          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            size=$(stat -c%s "$apk")
            existing_id=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .id' attached.json | head -1)
            existing_size=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .size' attached.json | head -1)

            if [ -n "$existing_id" ]; then
              if [ "$existing_size" = "$size" ]; then
                echo "### 附件 $name 已存在且大小一致（$size 字节），跳过" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              # 大小不同就是两个不同的二进制，留着旧的等于让客户端下错包
              del=$(curl -sS -m 60 -o del_attach.json -w '%{http_code}' -X DELETE \
                "$api/releases/$RELEASE_ID/attach_files/$existing_id?access_token=$GITEE_TOKEN")
              if [ "$del" != "200" ] && [ "$del" != "204" ]; then
                echo "::error::删除旧的附件 $name 失败（HTTP $del）：$(head -c 500 del_attach.json)"
                exit 1
              fi
              echo "### 附件 $name 旧文件大小不符（$existing_size → $size），已删除重传" >> "$GITHUB_STEP_SUMMARY"
            fi

            code=$(curl -sS -m 900 -o upload.json -w '%{http_code}' \
              -X POST "$api/releases/$RELEASE_ID/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$apk")
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              echo "::error::上传 $name 到 Gitee 失败（HTTP $code）：$(head -c 800 upload.json)"
              exit 1
            fi
            echo "### 已上传 $name（$size 字节）" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "### Gitee 发行版：https://gitee.com/$GITEE_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # 版本文件写在 GitHub 仓库里，由 Gitee 镜像带过去。
      # 不能直接写 Gitee：镜像是用 GitHub 的 main 强制覆盖 Gitee 的 main，
      # 往镜像仓库上单独加的提交会在下一次同步时整批消失（实测丢过一次 version.json）。
      - name: 更新版本文件
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # 先同步远端：release 事件检出的可能不是 main 的最新状态，直接 push 会被拒
          git pull --rebase origin main

          # 字段与 App 侧的解析一一对应（见 data/UpdateChecker.kt 的 parseVersionFile）
          jq -cn \
            --arg tag "$TAG" \
            --arg apk "https://gitee.com/$GITEE_REPO/releases/download/$TAG/app-release.apk" \
            '{version: $tag, apk: $apk}' > version.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          # 重跑同一版时内容没变，不造空提交
          if git diff --cached --quiet; then
            echo "### 版本文件已是 $TAG，无需提交" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "release: $TAG"
          git push
          echo "### 版本文件已提交，等镜像同步到 Gitee 后客户端即可看到" >> "$GITHUB_STEP_SUMMARY"
